name: Deploy to GitHub Pages

on:
  # 每次推送到 `newblog` 分支时触发构建并发布
  push:
    branches: [ newblog ]
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

# 允许 push 到 main（发布分支）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false # Disable auto-install

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm astro build

      # noahbox.github.io 是用户/组织型 Pages 仓库，GitHub 只允许从 main 分支发布。
      # 因此把构建产物发布到 main 分支（发布分支），newblog 继续作为源码/默认分支。
      # 注意：必须先把 dist 移到仓库目录之外再 git init，否则 git 会沿用父仓库的 .git，
      # 导致把源码而非构建产物推到 main。
      - name: Publish built site to main (published branch)
        run: |
          rm -rf /tmp/site-out
          mv dist /tmp/site-out
          cd /tmp/site-out
          touch .nojekyll
          git init -q
          git checkout -B main
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "deploy: publish site to main"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/NoahBox/noahbox.github.io.git" main
